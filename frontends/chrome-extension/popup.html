<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Finideas Live STT</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 12px;
        min-width: 320px;
      }

      h1 {
        font-size: 16px;
        margin: 0 0 12px;
      }

      label {
        display: block;
        font-size: 12px;
        margin-bottom: 4px;
      }

      input {
        box-sizing: border-box;
        width: 100%;
        margin-bottom: 10px;
        padding: 8px;
      }

      button {
        width: 100%;
        padding: 10px;
        margin-top: 6px;
      }

      #status {
        margin-top: 12px;
        font-size: 12px;
        line-height: 1.4;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <h1>Finideas Live STT Bridge</h1>

    <label for="websocketUrl">WebSocket URL</label>
    <input id="websocketUrl" type="text" value="ws://127.0.0.1:8089" />

    <label for="callId">Call ID</label>
    <input id="callId" type="text" placeholder="meet-call-001" />

    <button id="startButton">Start Capture</button>
    <button id="stopButton">Stop Capture</button>

    <div id="status">Status: idle</div>

    <script src="popup.js"></script>
  </body>
</html>
